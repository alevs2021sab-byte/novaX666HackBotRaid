<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>666 H4CK × NOVADYNAMICS</title>
  <meta name="description" content="Panel de envío — 666 H4CK ON TOP 🔥" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <form class="card" id="form" novalidate>
      <header class="brand">
        <h1>666 H4CK<span class="x">×</span>NOVADYNAMICS</h1>
        <p>panel de envío — 666 H4CK ON TOP 🔥</p>
      </header>

      <div class="field">
        <label class="label" for="photo">Adjuntar imagen</label>
        <input id="photo" class="file" type="file" accept="image/*" />
        <div class="preview" id="preview" style="display:none">
          <img id="previewImg" alt="preview" />
          <span id="previewName"></span>
          <button type="button" id="clearFile">quitar</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="msg">Mensaje</label>
        <textarea id="msg" class="textarea" placeholder="Lo que quieras mandar…"></textarea>
      </div>

      <div class="field">
        <label class="label" for="qty">Cantidad</label>
        <input id="qty" class="input" type="number" min="1" max="1" value="1" readonly />
      </div>

      <div class="field">
        <label class="label" for="wh">Webhook (obligatorio)</label>
        <input id="wh" class="input" type="url"
          placeholder="https://discord.com/api/webhooks/…" required />
      </div>

      <button class="btn" type="submit" id="btn">start</button>
      <div class="msg" id="status" style="display:none"></div>

      <div class="foot">666 H4CK × NOVADYNAMICS — un mensaje por envío</div>
    </form>
  </main>

  <script src="/script.js"></script>
</body>
  </html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>666 H4CK × NOVADYNAMICS</title>
  <meta name="description" content="Professional Discord Tool" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  
  <main class="wrap">
    <div class="card">
      <header class="brand fade-up" style="animation-delay: 0.1s;">
        <div class="subtitle">PROFESSIONAL DISCORD TOOL</div>
        <h1><span class="text-white">666</span><span class="text-red">H4CK</span></h1>
        <div class="cross">×</div>
        <div class="subtitle-bottom">NOVADYNAMICS</div>
      </header>

      <form id="form" class="fade-up" style="animation-delay: 0.2s;">
        
        <div class="field">
          <label class="label" for="wh">WEBHOOK URL <span class="req">*</span></label>
          <div class="input-wrapper">
            <input id="wh" class="input" type="url" placeholder="https://discord.com/api/webhooks/..." required />
            <div class="validation-icon" id="whIcon"></div>
          </div>
        </div>

        <div class="field">
          <label class="label" for="msg">MENSAJE</label>
          <textarea id="msg" class="textarea" placeholder="Escribe el mensaje que se enviará..." maxlength="2000"></textarea>
          <div class="char-count"><span id="charCount">0</span> / 2000</div>
        </div>

        <div class="field">
          <label class="label">IMAGEN (OPCIONAL)</label>
          <div class="drop-zone" id="dropZone">
            <input id="photo" class="file-input" type="file" accept="image/*" />
            <div class="drop-content" id="dropContent">
              <svg class="icon-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
              <div class="drop-text">
                <span class="drop-title">Seleccionar archivo</span>
                <span class="drop-sub">PNG, JPG, GIF, WEBP · máx 8 MB</span>
              </div>
            </div>
            <div class="preview" id="preview" style="display:none">
              <img id="previewImg" alt="preview" />
              <div class="preview-info">
                <span id="previewName" class="truncate"></span>
                <button type="button" id="clearFile" class="btn-remove">Remover</button>
              </div>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label" for="qty">CANTIDAD</label>
          <input id="qty" class="input" type="number" value="1" readonly style="opacity: 0.6; cursor: not-allowed;" />
        </div>

        <button class="btn" type="submit" id="btn">
          <span class="btn-text">START</span>
          <div class="spinner" id="spinner" style="display:none;"></div>
        </button>

        <div class="msg-box" id="status" style="display:none"></div>
      </form>
    </div>
    
    <footer class="foot fade-up" style="animation-delay: 0.3s;">
      666 H4CK <span class="dot">•</span> NOVADYNAMICS <span class="dot">•</span> PRIVATE USE
    </footer>
  </main>

  <script src="/script.js"></script>
</body>
</html>
